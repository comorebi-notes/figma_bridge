<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { height: 100%; }
  body { box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 2px; margin: 0; padding: 0 12px; font: 12px/1.5 Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  p { margin: 0; }
  .status { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .status::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--figma-color-icon-disabled); }
  .status.is-connected::before { background: var(--figma-color-icon-success); }
  .log { overflow: hidden; color: var(--figma-color-text-secondary); white-space: nowrap; text-overflow: ellipsis; }
  .log:empty { display: none; }
</style>
</head>
<body>
<p id="status" class="status">接続待ち</p>
<p id="log" class="log"></p>
<script>
  // server.ts の PORT に合わせる
  const BRIDGE_URL = 'ws://localhost:3055/plugin'
  const RETRY_MS = 2000
  const statusElement = document.getElementById('status')
  const logElement = document.getElementById('log')
  let socket = null

  // 長い文は省略して表示するため、全文はポインタを重ねたときに出す
  const showLog = (text) => {
    logElement.textContent = text
    logElement.title = text
  }

  const connect = () => {
    socket = new WebSocket(BRIDGE_URL)
    socket.onopen = () => {
      statusElement.textContent = '接続済み'
      statusElement.classList.add('is-connected')
      // 開いているファイルの名前を code.js から受け取り、サーバーへ知らせる。メニューバーのアプリが表示に使う
      parent.postMessage({ pluginMessage: { type: 'hello' } }, '*')
    }
    socket.onclose = () => {
      statusElement.textContent = '接続待ち'
      statusElement.classList.remove('is-connected')
      setTimeout(connect, RETRY_MS)
    }
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data)
      showLog(`実行中: ${message.command}`)
      parent.postMessage({ pluginMessage: message }, '*')
    }
  }

  window.onmessage = (event) => {
    const reply = event.data.pluginMessage
    if (!reply) return
    if (reply.type === 'progress') {
      showLog(`実行中: ${reply.text}`)
      return
    }
    if (reply.type === 'hello') {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(reply))
      return
    }
    showLog(reply.ok ? `完了: ${reply.command}` : `失敗: ${reply.error}`)
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(reply))
  }

  connect()
</script>
</body>
</html>
